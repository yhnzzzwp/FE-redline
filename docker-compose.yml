services:
  redline-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_WA_PHONE: ${NEXT_PUBLIC_WA_PHONE:-6281234567890}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Server-only: dibaca Route Handler, tidak masuk bundle browser.
      - API_BASE_URL=${API_BASE_URL:-http://redline-web/api/v1}
    restart: unless-stopped
    networks:
      - redline-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  redline-network:
    driver: bridge
